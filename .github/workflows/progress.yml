# Runs the tutorial progress check on GitHub after every push, pull request and review.
# Red = something is broken in that commit (conflict markers, invalid notebook, syntax error).
# The checkpoint table is in the run's Summary; status.json goes to the robot branch
# "tutorial-status", which the progress page reads. You never need to touch that branch.
name: Tutorial progress

on:
  push:
    branches-ignore: [tutorial-status]
  pull_request:
    types: [opened, reopened, closed]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tutorial-progress
  cancel-in-progress: false

jobs:
  progress:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_progress.py --ci

      - name: Publish status.json to the tutorial-status branch
        if: always()
        env:
          GIT_AUTHOR_NAME: tutorial-progress[bot]
          GIT_AUTHOR_EMAIL: tutorial-progress[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: tutorial-progress[bot]
          GIT_COMMITTER_EMAIL: tutorial-progress[bot]@users.noreply.github.com
        run: |
          test -f status.json || exit 0
          blob=$(git hash-object -w status.json)
          tree=$(printf '100644 blob %s\tstatus.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Tutorial progress")
          git push --force origin "$commit:refs/heads/tutorial-status"
